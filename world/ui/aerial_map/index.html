 if(cache.size>24){for(const [key,rec] of [...cache].sort((a,b)=>a[1].used-b[1].used)){if(cache.size<=24)break;if(!wanted.has(key))cache.delete(key)}}
 if(labels){
  const occupied=[],t=Math.max(0,Math.min(1,(zoom-.75)/(1.8-.75))),fade=t*t*(3-2*t);

  for(const place of order){
   const alpha=place.local_place?fade:1;if(alpha<=0)continue;
   const [x,y]=screen(place.x,place.z);if(x<10||x>width-10||y<10||y>height-10)continue;
   ctx.font=place.local_place?'16px Celestia':'13px system-ui';
   const tw=ctx.measureText(place.name).width,b=[Math.max(4,Math.min(width-tw-16,x+9)),Math.max(4,Math.min(height-28,y-20)),tw+12,25];
   if(occupied.some(a=>a[0]<b[0]+b[2]+3&&a[0]+a[2]+3>b[0]&&a[1]<b[1]+b[3]+3&&a[1]+a[3]+3>b[1]))continue;
   occupied.push(b);ctx.globalAlpha=alpha;ctx.fillStyle='#000000dc';ctx.fillRect(...b);ctx.fillStyle='#ffffff';ctx.fillText(place.name,b[0]+6,b[1]+18);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
  }
 }
 let metres=10**Math.floor(Math.log10(100/zoom));if(metres*zoom<35)metres*=5;
 const scale=document.querySelector('#scale');scale.textContent=metres>=1000?(metres/1000).toFixed(1)+' km':metres+' m';scale.style.width=metres*zoom+'px';scale.style.minWidth='0';
}
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,cx,cz];canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{const p=world(e.clientX,e.clientY);document.querySelector('#position').textContent=`X ${p[0].toFixed(1)}  Z ${p[1].toFixed(1)} · Drag to pan · Scroll to zoom`;if(!drag)return;cx=drag[2]-(e.clientX-drag[0])/zoom;cz=drag[3]-(e.clientY-drag[1])/zoom;requestDraw()});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();const before=world(e.clientX,e.clientY);zoom=Math.max(.008,Math.min(6,zoom*Math.exp(-e.deltaY*.0015)));const after=world(e.clientX,e.clientY);cx+=before[0]-after[0];cz+=before[1]-after[1];requestDraw()},{passive:false});
document.querySelector('#whole').onclick=fit;
document.querySelector('#town').onclick=()=>{cx=100;cz=-210;zoom=Math.min(width/560,height/480);requestDraw()};
document.querySelector('#labels').onclick=e=>{labels=!labels;e.target.setAttribute('aria-pressed',String(labels));requestDraw()};
const finder=document.querySelector('#places');
for(const [index,place] of places.entries()){const option=document.createElement('option');option.value=index;option.textContent=place.name;finder.append(option)}
finder.onchange=()=>{if(finder.value==='')return;const place=places[Number(finder.value)];cx=place.x;cz=place.z;zoom=Math.max(zoom,place.local_place?1.8:.15);document.querySelector('#position').textContent=`${place.name} · X ${cx.toFixed(1)}  Z ${cz.toFixed(1)}`;requestDraw()};
if(document.fonts)document.fonts.ready.then(requestDraw);
addEventListener('resize',resize);resize();fit();if(location.hash==='#town')document.querySelector('#town').click();
